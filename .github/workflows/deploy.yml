name: Build and deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

# Azure login with OpenID Connect, like namu2: GitHub hands the job a
# short-lived token that Azure trusts through a federated credential, so
# there is no client secret to expire. Set up in Azure (Microsoft Entra ID →
# App registrations → the deploy app → Certificates & secrets → Federated
# credentials) for repo Prodeko/Bilis-2, environment "Production", plus the
# repository secrets CLIENT_ID, TENANT_ID and SUBSCRIPTION_ID.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: "Production"
      url: "https://bilis2.prodeko.org"

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Docker login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          docker build -f Dockerfile.prod . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/bilis/bilis
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/bilis/bilis

      - name: Deploy from ACR
        uses: azure/webapps-deploy@v3
        with:
          app-name: "bilis2"
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/bilis/bilis

      - name: Azure logout
        if: always()
        run: |
          az logout
